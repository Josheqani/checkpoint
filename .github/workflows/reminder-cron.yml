name: Check Reminders Cron

on:
  schedule:
    # Trigger every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    name: Check Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Check Reminders Endpoint
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            https://checkpoint.josheqani-824.workers.dev/api/check-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d: -f2)

          echo "Response: $body"
          echo "Status: $status"

          if [ "$status" -ne 200 ]; then
            echo "::error::Endpoint returned HTTP status $status"
            exit 1
          fi
