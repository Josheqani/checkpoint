<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Checkmark -->
    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Base for Adaptive Masking -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Subtle Checkpoint Milestone Target Ring (Well within 80% safe zone) -->
  <circle cx="256" cy="256" r="168" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Crisp Modern Checkmark -->
  <g filter="url(#checkShadow)">
    <path
      d="M152 262 L226 336 L362 176"
      fill="none"
      stroke="url(#checkGrad)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
