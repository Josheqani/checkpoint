<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Milestone Orbit Rings -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="132" stroke="rgba(255,255,255,0.14)" stroke-width="6" fill="none"/>

  <!-- Central Checkpoint Glyph with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Checkpoint Flagpole / Milestone Mast -->
    <path d="M192 120 L192 376" stroke="#c7d2fe" stroke-width="18" stroke-linecap="round"/>
    <!-- Flag Banner -->
    <path d="M192 128 L320 188 L192 248 Z" fill="url(#flagGrad)" filter="url(#innerGlow)"/>
    
    <!-- Bold Completion Checkmark Crossing Through -->
    <path d="M148 274 L224 346 L376 172" fill="none" stroke="url(#checkGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Checkpoint Summit Beacon -->
    <circle cx="192" cy="120" r="12" fill="#38bdf8"/>
    <circle cx="192" cy="120" r="6" fill="#ffffff"/>
  </g>
</svg>
